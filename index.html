<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Explorador Rick and Morty</title>
        <link rel="stylesheet" href="css/styles.css">
    </head>
    <body>
        <header class="header">
            <h1  class="header__title">Rick and Morty Explorer</h1>
        </header>

        <main class="main-container">
            <section class="search-container">
                <form id="search-form" class="search-form">
                    <div class="form-group">
                        <label for="input-name">Nombre:</label>
                        <input type="text" id="input-name" placeholder="Ej. Rick, Earth, Pilot...">
                    </div>
                    <!--VARIANTE C-->
                    <div class="form-group">
                        <label for="input-filter">Temporada:</label>
                        <select id="input-filter">
                            <option value="">Todas</option>
                            <option value="S01">S01</option>
                            <option value="S02">S02</option>
                            <option value="S03">S03</option>
                            <option value="S04">S04</option>
                            <option value="S05">S05</option>
                        </select>
                    </div>
                    <button type="submit" id="btn-search" class="btn-search">Buscar</button>
                </form>
            </section>
            <div id="status-message" class="status-message" aria-live="polite"></div>
            <section id="results-grid" class="results-grid"></section>
        </main>
        <footer class="footer">
            <p>Desarrollado por Mariana Claverol - Fundamentos de Desarrollo Web</p>
        </footer>
        <script src="js/app.js"></script>
    </body>
</html>
